<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=800, height=480, user-scalable=no">
    <title>Kiosk Print</title>
    <link rel="stylesheet" href="kiosk.css">
  </head>
    
  <body>
    <div id="paid"></div>
    <main id="app">Loading...</main>
    <div id="viewer" hidden>
      <div id="vstage"><img id="vimg" alt="" draggable="false"><p id="vload">Loading...</p></div>
      <div id="vbar">
        <button data-v="prev">&lsaquo; Prev</button>
        <span id="vpage"></span>
        <button data-v="next">Next &rsaquo;</button>
        <button data-v="out">&minus;</button>
        <button data-v="in">+</button>
        <button class="primary" data-v="close">Close</button>
      </div>
    </div>
    <div id="toast" hidden></div>
    <script src="kiosk.js"></script>
  </body>
</html>
