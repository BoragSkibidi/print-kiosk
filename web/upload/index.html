<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kiosk Print - Upload</title>
    <<link rel="stylesheet" href="upload.css">
  </head>

  <body>
    <h1>Kiosk Print</h1>
    <p>Upload a PDF, Word or PowerPoint file. Then choose Colored or Black and white and pay at the machine.</p>
    <p id="busy" class="err" hidden>Tap "Print from phone" on the machine first.</p>
    <input id="file" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx">
    <button id="go" disabled>Upload</button>
    <progress id="bar" max="100" value="0" hidden></progress>
    <p id="msg"></p>
    <p class="small">Your file is deleted after printing.</p>
    
    <script src="upload.js"></script>
  </body>
</html>
